<svg xmlns="http://www.w3.org/2000/svg" width="800" height="130" viewBox="0 0 800 130">
  <defs>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="shimmerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="white" stop-opacity="0"/>
      <stop offset="50%"  stop-color="white" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="textClip">
      <text x="400" y="70"
        font-family="'Courier New', Courier, monospace"
        font-size="34"
        font-weight="bold"
        letter-spacing="8"
        text-anchor="middle"
        dominant-baseline="middle">MATTHEW KIM</text>
    </clipPath>
    <pattern id="scanlines" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="2" fill="rgba(0,0,0,0.15)"/>
    </pattern>
    <style>
      @keyframes glowPulse {
        0%,100% { opacity: 0.85; }
        50%      { opacity: 1;    }
      }
      @keyframes pulse {
        0%,100% { opacity: 0.4; }
        50%     { opacity: 1;   }
      }
      .star  { animation: pulse 2s ease-in-out infinite; }
      .star2 { animation: pulse 3s ease-in-out infinite; }
      .star3 { animation: pulse 1.6s ease-in-out infinite; }
      #nameGroup { animation: glowPulse 3s ease-in-out infinite; }
    </style>
  </defs>


  <!-- Pixel border corners -->
  <rect x="8"   y="8"   width="4" height="4" fill="#d4a373"/>
  <rect x="16"  y="8"   width="4" height="4" fill="#d4a373" opacity="0.55"/>
  <rect x="24"  y="8"   width="4" height="4" fill="#d4a373" opacity="0.25"/>
  <rect x="8"   y="16"  width="4" height="4" fill="#d4a373" opacity="0.55"/>
  <rect x="8"   y="24"  width="4" height="4" fill="#d4a373" opacity="0.25"/>
  <rect x="788" y="8"   width="4" height="4" fill="#d4a373"/>
  <rect x="780" y="8"   width="4" height="4" fill="#d4a373" opacity="0.55"/>
  <rect x="772" y="8"   width="4" height="4" fill="#d4a373" opacity="0.25"/>
  <rect x="788" y="16"  width="4" height="4" fill="#d4a373" opacity="0.55"/>
  <rect x="788" y="24"  width="4" height="4" fill="#d4a373" opacity="0.25"/>
  <rect x="8"   y="118" width="4" height="4" fill="#d4a373"/>
  <rect x="16"  y="118" width="4" height="4" fill="#d4a373" opacity="0.55"/>
  <rect x="24"  y="118" width="4" height="4" fill="#d4a373" opacity="0.25"/>
  <rect x="8"   y="110" width="4" height="4" fill="#d4a373" opacity="0.55"/>
  <rect x="8"   y="102" width="4" height="4" fill="#d4a373" opacity="0.25"/>
  <rect x="788" y="118" width="4" height="4" fill="#d4a373"/>
  <rect x="780" y="118" width="4" height="4" fill="#d4a373" opacity="0.55"/>
  <rect x="772" y="118" width="4" height="4" fill="#d4a373" opacity="0.25"/>
  <rect x="788" y="110" width="4" height="4" fill="#d4a373" opacity="0.55"/>
  <rect x="788" y="102" width="4" height="4" fill="#d4a373" opacity="0.25"/>

  <!-- Pixel stars — avoid name zone x=200-600 y=53-101 -->
  <!-- Left column -->
  <rect class="star"  x="18"  y="38"  width="4" height="4" fill="#d4a373" opacity="0.8"/>
  <rect class="star2" x="45"  y="72"  width="2" height="2" fill="#d4a373" opacity="0.5"/>
  <rect class="star3" x="70"  y="22"  width="3" height="3" fill="#d4a373" opacity="0.7"/>
  <rect class="star"  x="95"  y="58"  width="2" height="2" fill="#d4a373" opacity="0.45"/>
  <rect class="star2" x="115" y="112" width="4" height="4" fill="#d4a373" opacity="0.6"/>
  <rect class="star3" x="140" y="40"  width="2" height="2" fill="#d4a373" opacity="0.5"/>
  <rect class="star"  x="155" y="90"  width="3" height="3" fill="#d4a373" opacity="0.55"/>
  <rect class="star2" x="175" y="15"  width="2" height="2" fill="#d4a373" opacity="0.4"/>
  <rect class="star3" x="185" y="68"  width="1" height="1" fill="#d4a373" opacity="0.6"/>
  <rect class="star"  x="30"  y="100" width="2" height="2" fill="#d4a373" opacity="0.4"/>
  <!-- Right column -->
  <rect class="star3" x="620" y="30"  width="3" height="3" fill="#d4a373" opacity="0.7"/>
  <rect class="star"  x="645" y="90"  width="2" height="2" fill="#d4a373" opacity="0.5"/>
  <rect class="star2" x="670" y="55"  width="4" height="4" fill="#d4a373" opacity="0.65"/>
  <rect class="star3" x="695" y="112" width="2" height="2" fill="#d4a373" opacity="0.45"/>
  <rect class="star"  x="715" y="18"  width="3" height="3" fill="#d4a373" opacity="0.7"/>
  <rect class="star2" x="735" y="78"  width="2" height="2" fill="#d4a373" opacity="0.5"/>
  <rect class="star3" x="755" y="42"  width="4" height="4" fill="#d4a373" opacity="0.6"/>
  <rect class="star"  x="775" y="105" width="2" height="2" fill="#d4a373" opacity="0.4"/>
  <rect class="star2" x="610" y="108" width="3" height="3" fill="#d4a373" opacity="0.55"/>
  <rect class="star3" x="632" y="65"  width="1" height="1" fill="#d4a373" opacity="0.7"/>
  <!-- Top strip (above name, center) -->
  <rect class="star"  x="230" y="18"  width="2" height="2" fill="#d4a373" opacity="0.4"/>
  <rect class="star2" x="310" y="12"  width="3" height="3" fill="#d4a373" opacity="0.5"/>
  <rect class="star3" x="400" y="10"  width="2" height="2" fill="#d4a373" opacity="0.35"/>
  <rect class="star"  x="480" y="20"  width="2" height="2" fill="#d4a373" opacity="0.45"/>
  <rect class="star2" x="560" y="14"  width="3" height="3" fill="#d4a373" opacity="0.5"/>
  <!-- Bottom strip (below divider, center) -->
  <rect class="star3" x="250" y="108" width="2" height="2" fill="#d4a373" opacity="0.4"/>
  <rect class="star"  x="360" y="114" width="3" height="3" fill="#d4a373" opacity="0.45"/>
  <rect class="star2" x="450" y="106" width="2" height="2" fill="#d4a373" opacity="0.5"/>
  <rect class="star3" x="545" y="116" width="2" height="2" fill="#d4a373" opacity="0.4"/>

  <!-- Name with glow pulse -->
  <g id="nameGroup">
    <text x="400" y="70"
      font-family="'Courier New', Courier, monospace"
      font-size="34"
      font-weight="bold"
      letter-spacing="8"
      fill="#d4a373"
      text-anchor="middle"
      dominant-baseline="middle"
      filter="url(#glow)">MATTHEW KIM</text>

  </g>

  <!-- Shimmer sweep (clips to text shape) -->
  <rect x="-250" y="35" width="250" height="70" fill="url(#shimmerGrad)" clip-path="url(#textClip)">
    <animateTransform attributeName="transform" type="translate"
      from="-250 0" to="1050 0"
      dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
  </rect>

</svg>
